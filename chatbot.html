<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김해리의 교육용 안전문서 검색</title>
  <style>
    :root {
      /* color */
      --bg: #ffffff;
      --bg-sub: #f5f6f8;
      --text: #1a1a1a;
      --text-sub: #6b7280;
      --line: #e5e7eb;
      --point: #3b5bff;

      /* type */
      --font: "Pretendard", system-ui, sans-serif;
      --fs-display: 56px;
      --fs-heading: 32px;
      --fs-body: 17px;
      --fs-caption: 14px;

      /* space & shape */
      --s1: 8px;
      --s2: 16px;
      --s3: 24px;
      --s4: 48px;
      --s5: 96px;
      --radius: 12px;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--fs-body);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color .2s;
    }

    a:hover {
      color: var(--point);
      text-decoration: underline;
    }
.back-link {
  display: inline-block;
  margin-bottom: var(--s4);
  padding: var(--s1) var(--s2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-sub);
  font-size: var(--fs-caption);
  font-weight: 500;
}

.back-link:hover {
  border-color: var(--point);
  text-decoration: none;
}    
    .page {
      width: min(100% - 32px, var(--max-width));
      margin: 0 auto;
      padding: var(--s5) 0;
    }

    .hero {
      margin-bottom: var(--s5);
    }

    .eyebrow,
    .caption {
      color: var(--text-sub);
      font-size: var(--fs-caption);
      font-weight: 500;
      line-height: 1.5;
    }

    h1 {
      max-width: 680px;
      margin: var(--s2) 0 var(--s3);
      font-size: var(--fs-display);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .notice-list {
      display: grid;
      gap: var(--s2);
      max-width: 680px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notice-list li {
      padding: var(--s2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text-sub);
      font-size: var(--fs-caption);
      font-weight: 500;
    }

    .search-panel {
      display: grid;
      gap: var(--s3);
      padding: var(--s3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: var(--s5);
    }

    label {
      display: block;
      margin-bottom: var(--s1);
      font-size: var(--fs-caption);
      font-weight: 500;
      color: var(--text-sub);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--s2);
    }

    input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 var(--s2);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color .2s;
    }

    input:focus {
      border-color: var(--point);
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 var(--s3);
      background: var(--point);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .2s;
    }

    button:hover {
      background: #2745d8;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s1);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .keyword-list li {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--s1) var(--s2);
      color: var(--text-sub);
      font-size: var(--fs-caption);
      font-weight: 500;
    }

    .results {
      display: grid;
      gap: var(--s3);
    }

    .result-status {
      color: var(--text-sub);
      font-size: var(--fs-caption);
      font-weight: 500;
    }

    .result-card {
      padding: var(--s3);
      background: var(--bg-sub);
      border-radius: var(--radius);
    }

    .result-card h2 {
      margin: 0 0 var(--s2);
      font-size: var(--fs-heading);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .result-card ol {
      margin: 0;
      padding-left: var(--s3);
    }

    .result-card li {
      max-width: 680px;
      margin-bottom: var(--s1);
    }

    .result-card li:last-child {
      margin-bottom: 0;
    }

    .query-text {
      overflow-wrap: anywhere;
      color: var(--text);
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 32px, var(--max-width));
        padding: var(--s4) 0;
      }

      h1 {
        font-size: 40px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .search-panel,
      .result-card {
        padding: var(--s2);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <main class="page">
  <a class="back-link" id="backLink" href="../index.html#tools" target="_top">← 포트폴리오로 돌아가기</a>
  <section class="hero" aria-labelledby="page-title">
    <p class="eyebrow">교육용 안전문서 규칙검색</p>
      <h1 id="page-title">김해리의 교육용 안전문서 검색</h1>
      <ul class="notice-list" aria-label="안내">
        <li>이 화면의 검색 결과는 실제 AI 답변이 아니라 문서 안에 저장된 조항 원문을 찾아 보여주는 것입니다.</li>
        <li>이 자료는 교육용이라 현장 판단에 쓸 수 없으며, 실제 현장에서는 소속 사업장의 안전관리자 지침을 따르십시오.</li>
      </ul>
    </section>

    <section class="search-panel" aria-label="질문 검색">
      <div>
        <label for="question">질문 입력</label>
        <div class="search-row">
          <input id="question" type="text" autocomplete="off" placeholder="예: 용접 작업 전에 무엇을 확인해야 하나요?">
          <button id="searchButton" type="button">검색</button>
        </div>
      </div>
      <div>
        <p class="caption">찾아낼 단어</p>
        <ul class="keyword-list" id="keywordList"></ul>
      </div>
    </section>

    <section class="results" aria-live="polite" aria-label="검색 결과">
      <p class="result-status" id="status">질문을 입력하면 관련 조항 원문을 보여줍니다.</p>
      <div id="results"></div>
    </section>
  </main>

  <script>
    const rules = [
      {
        number: "제1조",
        title: "개인보호구",
        keywords: ["개인보호구", "보호구", "안전모", "안전화", "보안경", "보안면", "방진마스크", "용접 장갑"],
        clauses: [
          "작업장 출입 시 안전모, 안전화, 보안경을 항상 착용한다.",
          "용접·연삭 작업 시 보안면, 방진마스크, 용접 장갑을 추가로 착용한다.",
          "보호구가 파손되거나 없는 상태로는 어떤 작업도 시작하지 않는다. \"잠깐만\"도 예외가 아니다.",
          "보호구가 없으면 작업을 중단하고 현장 안전관리자에게 지급을 요청한다."
        ]
      },
      {
        number: "제2조",
        title: "고소작업",
        keywords: ["고소작업", "높이", "안전대", "걸이", "추락", "개구부", "발판", "안전난간", "강풍", "강우", "강설", "사다리"],
        clauses: [
          "높이 2m 이상에서 작업할 때는 작업 시작 전에 안전대를 착용하고, 지정된 걸이 지점에 건다.",
          "추락 위험이 있는 개구부와 작업 발판 가장자리에는 안전난간을 먼저 설치한다.",
          "강풍(순간풍속 10m/s 이상), 강우, 강설 시 옥외 고소작업을 중지한다.",
          "사다리 위에서 용접·연삭 등 양손 작업을 하지 않는다."
        ]
      },
      {
        number: "제3조",
        title: "밀폐공간",
        keywords: ["밀폐공간", "탱크", "이중저", "코퍼댐", "산소농도", "유해가스", "환기", "작업 허가서", "감시인", "출입구"],
        clauses: [
          "탱크, 이중저, 코퍼댐 등 밀폐공간에 들어가기 전에 산소농도(18~23.5%)와 유해가스 농도를 측정하고 기록한다.",
          "측정 결과가 기준을 벗어나면 환기 후 재측정하고, 기준에 들어올 때까지 출입하지 않는다.",
          "출입 전 밀폐공간 작업 허가서를 발급받고, 외부에 감시인 1명 이상을 배치한다.",
          "작업 중에도 산소농도를 계속 측정하고, 감시인은 출입구를 떠나지 않는다."
        ]
      },
      {
        number: "제4조",
        title: "용접·화기작업",
        keywords: ["용접", "화기작업", "허가서", "가연물", "불연 덮개", "화재감시자", "소화기", "가스 호스", "용접 케이블"],
        clauses: [
          "화기작업 전에 화기작업 허가서를 발급받고, 반경 10m 이내의 가연물을 제거하거나 불연 덮개로 덮는다.",
          "화기작업 중에는 화재감시자를 배치하고, 소화기를 작업 위치 3m 이내에 둔다.",
          "화재감시자는 작업 종료 후 30분간 현장을 감시한다.",
          "가스 호스와 용접 케이블의 손상 여부를 작업 전에 점검한다."
        ]
      },
      {
        number: "제5조",
        title: "크레인·중량물",
        keywords: ["크레인", "중량물", "인양", "인양물", "신호수", "운전자", "와이어로프", "슬링", "샤클", "정격 하중"],
        clauses: [
          "크레인으로 중량물을 인양하는 동안 인양물 아래와 반경 내에 사람이 서거나 지나가지 않는다.",
          "신호수는 1명만 지정하고, 운전자는 지정된 신호수의 신호에만 따른다.",
          "와이어로프, 슬링, 샤클은 작업 전 점검하고 손상된 것은 즉시 폐기한다.",
          "인양물의 무게가 정격 하중을 초과하면 인양하지 않는다."
        ]
      },
      {
        number: "제6조",
        title: "전기",
        keywords: ["전기", "전원", "차단", "잠금장치", "LOTO", "표지", "젖은 손", "전기 기기", "전선", "콘센트", "누전차단기"],
        clauses: [
          "전기 설비 작업 전에 전원을 차단하고 잠금장치(LOTO)와 표지를 부착한다.",
          "젖은 손이나 젖은 장소에서 전기 기기를 다루지 않는다.",
          "피복이 벗겨진 전선과 파손된 콘센트는 사용하지 않고 즉시 신고한다.",
          "이동식 전기 기기는 누전차단기를 거쳐 사용한다."
        ]
      },
      {
        number: "제7조",
        title: "화학물질",
        keywords: ["화학물질", "도료", "희석제", "세척제", "물질안전보건자료", "MSDS", "내화학 장갑", "보안경", "환기", "라벨", "음료 용기", "피부", "눈"],
        clauses: [
          "도료, 희석제, 세척제 등 화학물질을 다루기 전에 물질안전보건자료(MSDS)를 확인한다.",
          "화학물질을 다룰 때는 내화학 장갑과 보안경을 착용하고 환기를 유지한다.",
          "화학물질 용기에는 반드시 내용물 표시 라벨을 부착하고, 음료 용기에 옮겨 담지 않는다.",
          "피부에 닿거나 눈에 들어가면 즉시 흐르는 물로 15분 이상 씻고 보고한다."
        ]
      },
      {
        number: "제8조",
        title: "출입통제",
        keywords: ["출입통제", "출입구", "출입증", "위험구역", "도장", "방사선 검사", "인양", "출입 표지", "외부 방문자", "안전교육", "인솔자", "보행로"],
        clauses: [
          "지정된 출입구로만 출입하고, 출입증을 항상 패용한다.",
          "위험구역(도장 중, 방사선 검사 중, 인양 중)에는 출입 표지가 있는 동안 들어가지 않는다.",
          "외부 방문자는 안전교육 이수 후 인솔자와 함께 이동한다.",
          "작업장 내에서는 지정된 보행로로 이동하고 뛰지 않는다."
        ]
      },
      {
        number: "제9조",
        title: "비상대응",
        keywords: ["비상대응", "화재", "가스 누출", "추락", "비상 상황", "비상연락번호", "대피", "집결지", "엘리베이터", "크레인", "소화기", "비상샤워", "구급함"],
        clauses: [
          "화재, 가스 누출, 추락 등 비상 상황을 발견하면 즉시 큰 소리로 알리고 비상연락번호로 신고한다.",
          "대피 방송이 나오면 작업을 멈추고 지정된 대피 경로로 집결지에 모인다.",
          "엘리베이터와 크레인은 대피에 사용하지 않는다.",
          "소화기, 비상샤워, 구급함의 위치를 작업 시작 전에 확인한다."
        ]
      },
      {
        number: "제10조",
        title: "사고보고",
        keywords: ["사고보고", "부상", "아차사고", "설비 손상", "안전관리자", "사고 현장", "보고", "일시", "장소", "작업 내용", "목격자", "불이익"],
        clauses: [
          "부상, 아차사고, 설비 손상은 크기와 관계없이 당일 안전관리자에게 보고한다.",
          "사고 현장은 조사가 끝날 때까지 보존한다.",
          "보고 내용에는 일시, 장소, 작업 내용, 부상 부위, 목격자를 포함한다.",
          "보고자에게 불이익을 주지 않는다."
        ]
      }
    ];

    const questionInput = document.querySelector("#question");
    const searchButton = document.querySelector("#searchButton");
    const keywordList = document.querySelector("#keywordList");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");

    const allKeywords = rules.map((rule) => rule.title);

    allKeywords.forEach((keyword) => {
      const item = document.createElement("li");
      item.textContent = keyword;
      keywordList.appendChild(item);
    });

    function findMatches(query) {
      const normalizedQuery = query.replace(/\s+/g, "").toLowerCase();
      return rules.filter((rule) => {
        return rule.keywords.some((keyword) => {
          const normalizedKeyword = keyword.replace(/\s+/g, "").toLowerCase();
          return normalizedQuery.includes(normalizedKeyword);
        });
      });
    }

    function renderResults(matches, query) {
      results.textContent = "";

      if (!query.trim()) {
        status.textContent = "질문이 모호합니다. 개인보호구, 고소작업, 밀폐공간처럼 조항 제목의 단어를 포함해 주세요.";
        return;
      }

      if (matches.length === 0) {
        status.innerHTML = "";
        const text = document.createElement("span");
        text.textContent = "관련 조항을 찾지 못했습니다. 문서 조항 제목의 단어로 다시 검색해 주세요.";
        status.appendChild(text);
        return;
      }

      status.innerHTML = "";
      const statusText = document.createElement("span");
      statusText.textContent = "입력한 질문: ";
      const queryText = document.createElement("span");
      queryText.className = "query-text";
      queryText.textContent = query;
      status.append(statusText, queryText);

      matches.forEach((rule) => {
        const card = document.createElement("article");
        card.className = "result-card";

        const heading = document.createElement("h2");
        heading.textContent = `${rule.number} (${rule.title})`;

        const list = document.createElement("ol");
        rule.clauses.forEach((clause) => {
          const item = document.createElement("li");
          item.textContent = clause;
          list.appendChild(item);
        });

        card.append(heading, list);
        results.appendChild(card);
      });
    }

    function search() {
      const query = questionInput.value;
      const matches = findMatches(query);
      renderResults(matches, query);
    }

    searchButton.addEventListener("click", search);
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        search();
      }
    });
  if (window.self !== window.top) document.querySelector("#backLink").style.display = "none";
  </script>
</body>
</html>
